<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background circle (optional – looks good as favicon) -->
  <circle cx="50" cy="50" r="48" fill="#1e40af"/>
  
  <!-- Caduceus (simplified & bold for small sizes) -->
  <g transform="translate(50 50) scale(0.85)">
    <!-- Wings -->
    <path d="M-28 -22 C-22 -32, -12 -34, 0 -28 C12 -34, 22 -32, 28 -22 
             C18 -18, 10 -12, 0 -16 C-10 -12, -18 -18, -28 -22Z" 
          fill="#ffffff"/>
    
    <!-- Central staff -->
    <rect x="-3" y="-32" width="6" height="68" rx="2" fill="#ffffff"/>
    
    <!-- Top ball -->
    <circle cx="0" cy="-36" r="5" fill="#ffffff"/>
    
    <!-- Left snake -->
    <path d="M-4 -18 
             C-16 -14, -22 -4, -18 6 
             C-14 16, -6 20, 0 14 
             C4 20, 12 16, 16 6 
             C20 -4, 14 -14, 4 -18" 
          stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Right snake (mirrored) -->
    <path d="M4 -18 
             C16 -14, 22 -4, 18 6 
             C14 16, 6 20, 0 14 
             C-4 20, -12 16, -16 6 
             C-20 -4, -14 -14, -4 -18" 
          stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>